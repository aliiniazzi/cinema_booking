spring.application.name=cinema-booking
spring.datasource.url=${DB_URL:jdbc:mysql://db:3306/cinema_booking?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tehran}
spring.datasource.username=${DB_USERNAME:cinema}
spring.datasource.password=${DB_PASSWORD:cinema_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY
springdoc.swagger-ui.csrf.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.mvc.locale=fa
spring.mvc.locale-resolver=fixed
